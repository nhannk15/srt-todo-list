version: '3.8'

services:
  db:
    image: postgres:15
    container_name: todolist_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d todolist"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: todolist_backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
  
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: todolist_frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: